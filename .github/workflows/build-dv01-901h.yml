name: Build ImmortalWrt for DV01-901H (KT-708)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt Branch'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - openwrt-24.10
      release:
        description: 'Create GitHub Release?'
        required: false
        default: true
        type: boolean

  push:
    branches: [ main, master ]

  schedule:
    - cron: '0 3 * * 0'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: ${{ github.event.inputs.branch || 'master' }}
  TZ: Africa/Cairo

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build DV01-901H (IPQ4019)

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Build Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache clang cmake cpio curl \
          device-tree-compiler ecj fastjar flex gawk gettext \
          gcc-multilib g++-multilib git gnutls-dev gperf haveged \
          help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
          libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
          pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons \
          squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
          unzip vim wget xmlto xxd zlib1g-dev zstd bc
        sudo apt-get clean

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/cabal /opt/haskell /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        sudo docker image prune -a -f
        df -h

    - name: Clone ImmortalWrt Latest
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        echo "Branch: $REPO_BRANCH"
        git log -1 --format="%H %s %ci"

    - name: Copy Device Tree & Configs
      run: |
        DTS_DIR="openwrt/target/linux/ipq40xx/files/arch/arm/boot/dts/qcom"
        mkdir -p "$DTS_DIR"
        cp dts/qcom-ipq4019-dv01-901h.dts "$DTS_DIR/"
        echo "DTS copied to: $DTS_DIR"

        cp .config openwrt/.config
        echo "Config copied"

        if [ -d "base-files" ]; then
          cp -r base-files/* openwrt/target/linux/ipq40xx/base-files/ 2>/dev/null || true
          echo "base-files copied"
        fi

        if [ -f "image/generic.mk.patch" ]; then
          echo "" >> openwrt/target/linux/ipq40xx/image/generic.mk
          echo "" >> openwrt/target/linux/ipq40xx/image/generic.mk
          cat image/generic.mk.patch >> openwrt/target/linux/ipq40xx/image/generic.mk
          echo "Device definition appended"
        fi

        echo "=== Verifying davolink_dv01-901h in generic.mk ==="
        grep -n "davolink_dv01-901h" openwrt/target/linux/ipq40xx/image/generic.mk || {
          echo "ERROR: davolink_dv01-901h NOT FOUND!"
          tail -30 openwrt/target/linux/ipq40xx/image/generic.mk
          exit 1
        }
        echo "Device definition verified"

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure Build
      run: |
        cd openwrt
        make defconfig
        echo "=== Verifying device selection in .config ==="
        if ! grep -q "CONFIG_TARGET_ipq40xx_generic_DEVICE_davolink_dv01-901h=y" .config; then
          echo "ERROR: Device NOT selected in .config!"
          grep "CONFIG_TARGET_ipq40xx_generic_DEVICE_" .config | head -20 || true
          exit 1
        fi
        echo "Device selected successfully"

    - name: Download Sources
      run: |
        cd openwrt
        make download -j$(nproc) 2>&1 | tee download.log || true
        find dl -size -1024c -exec ls -l {} \; 2>/dev/null || true
        find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true
        echo "Sources download completed"

    - name: Compile Firmware
      run: |
        cd openwrt
        echo "=== Starting parallel build ==="
        if ! make -j$(nproc) 2>&1 | tee build.log; then
          echo "Parallel build failed, retrying single thread..."
          make -j1 V=s 2>&1 | tee build_verbose.log
        fi
        echo "Compile step completed"

    - name: Verify Build
      run: |
        cd openwrt
        echo "=== Contents of bin/targets/ipq40xx/generic/ ==="
        ls -la bin/targets/ipq40xx/generic/ 2>/dev/null || echo "Directory not found!"

        SYSUPGRADE=$(find bin/targets/ipq40xx/generic/ -name "*dv01-901h*sysupgrade.bin" 2>/dev/null | head -1 || true)
        if [ -z "$SYSUPGRADE" ]; then
          echo "No dv01-901h image found, checking generic..."
          SYSUPGRADE=$(find bin/targets/ipq40xx/generic/ -name "*sysupgrade.bin" 2>/dev/null | head -1 || true)
        fi

        if [ -z "$SYSUPGRADE" ]; then
          echo "ERROR: No sysupgrade image found!"
          ls -la bin/targets/ipq40xx/generic/ 2>/dev/null || true
          exit 1
        fi

        SIZE=$(stat -c%s "$SYSUPGRADE")
        echo "Image found: $SYSUPGRADE"
        echo "Size: $(echo "scale=2; $SIZE / 1024 / 1024" | bc)MB"
        echo "Build verified!"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: immortalwrt-dv01-901h-${{ github.run_number }}
        path: |
          openwrt/bin/targets/ipq40xx/generic/*-sysupgrade.bin
          openwrt/bin/targets/ipq40xx/generic/*-initramfs*
          openwrt/bin/targets/ipq40xx/generic/*-factory*
          openwrt/build.log
          openwrt/build_verbose.log
          openwrt/download.log
        if-no-files-found: warn
        retention-days: 30

    - name: Build Summary
      if: always()
      run: |
        echo "======================================="
        echo "  Build Summary"
        echo "======================================="
        echo "Status: ${{ job.status }}"
        echo "Branch: ${{ env.REPO_BRANCH }}"
        echo "Device: Davolink DV01-901H"
        echo "Run #:  ${{ github.run_number }}"
        echo "======================================="
